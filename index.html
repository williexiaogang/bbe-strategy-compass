<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>蒼翼混沌效應 · 攻略工具</title>
<style>
  :root { --bg:#0b0c10; --panel:#15171f; --text:#e8e9ec; --muted:#9aa0af; --accent:#ff6b35; --accent-2:#f7c548; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #191d28 0%, #0b0c10 70%);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    justify-content: center;
  }
  .box { width: 100%; max-width: 460px; }
  .head { text-align: center; margin-bottom: 22px; }
  .emblem { font-size: 2.4rem; margin-bottom: 8px; }
  h1 { margin: 0 0 6px; font-size: 1.32rem; font-weight: 700; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .sub { margin: 0; color: var(--muted); font-size: .84rem; }
  .opts { display: flex; flex-direction: column; gap: 11px; }
  a.opt {
    display: flex; align-items: center; gap: 13px;
    padding: 15px 16px; background: var(--panel);
    border: 1px solid #2a2d38; border-radius: 14px;
    color: var(--text); text-decoration: none; transition: .15s;
  }
  a.opt:hover { border-color: var(--accent); background: #1a1d27; }
  a.opt .ic { font-size: 1.4rem; flex: 0 0 auto; }
  a.opt .t { font-weight: 700; font-size: .95rem; }
  a.opt .d { color: var(--muted); font-size: .76rem; }
  .tag {
    display: inline-block; font-size: .6rem; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; background: #6366f1; color: #fff; margin-left: 6px; vertical-align: middle;
  }
  .tag.reco { background: var(--accent-2); color: #241a00; }
  .foot { margin-top: 20px; color: #5c6373; font-size: .72rem; text-align: center; }

  /* ===== Title-screen look ===== */
  body {
    align-items: center; min-height: 100vh; overflow-x: hidden;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(255,107,53,.28), transparent 70%),
      radial-gradient(50% 40% at 100% 100%, rgba(239,68,68,.14), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.022) 0 1px, transparent 1px 24px),
      #08090c;
  }
  body::before {
    content: ''; position: fixed; inset: -20% -10% auto auto; width: 70vmax; height: 70vmax; pointer-events: none;
    background: conic-gradient(from 200deg, transparent 0 20%, rgba(255,107,53,.12) 25%, transparent 32%, rgba(247,197,72,.08) 40%, transparent 48%);
    clip-path: polygon(50% 0, 100% 0, 100% 100%, 20% 100%); filter: blur(2px);
  }
  .box { position: relative; max-width: 520px; }
  .emblem {
    width: 76px; height: 76px; margin: 0 auto 14px; display: grid; place-items: center; font-size: 0;
    background: linear-gradient(145deg, #ff6b35, #b91c1c);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    box-shadow: 0 0 40px rgba(255,107,53,.5); animation: emblem-glow 3s ease-in-out infinite;
  }
  .emblem svg { width: 40px; height: 40px; color: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  @keyframes emblem-glow { 50% { filter: brightness(1.2); } }
  .kicker { display: block; font-size: .7rem; letter-spacing: .5em; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  h1 { font-size: 1.9rem; font-weight: 900; letter-spacing: .08em; line-height: 1.25; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  h1 span { display: block; font-style: italic; font-size: 1.15em; background: linear-gradient(90deg, #ff6b35, #f7c548);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(255,107,53,.45)); }
  .head::after { content: ''; display: block; width: 120px; height: 3px; margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .opts { gap: 14px; }
  a.opt {
    position: relative; padding: 18px 18px 18px 16px; border-radius: 0; overflow: hidden;
    background: linear-gradient(100deg, rgba(30,33,43,.95), rgba(21,23,31,.9));
    border: 1px solid #2a2d38; border-left: 4px solid var(--accent);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
    transition: transform .2s, border-color .2s, background .2s;
  }
  a.opt::after { content: '▶'; margin-left: auto; color: var(--muted); font-size: .8rem; transition: transform .2s, color .2s; }
  a.opt:hover { transform: translateX(6px); border-color: var(--accent); background: linear-gradient(100deg, rgba(255,107,53,.18), rgba(21,23,31,.9)); }
  a.opt:hover::after { color: var(--accent); transform: translateX(4px); }
  a.opt:nth-child(2) { border-left-color: #4dd2ff; }
  a.opt:nth-child(2):hover { border-color: #4dd2ff; background: linear-gradient(100deg, rgba(77,210,255,.14), rgba(21,23,31,.9)); }
  a.opt .ic {
    width: 46px; height: 46px; display: grid; place-items: center; font-size: 0; color: var(--accent);
    background: rgba(0,0,0,.35); border: 1px solid currentColor; transform: rotate(45deg);
  }
  a.opt:nth-child(2) .ic { color: #4dd2ff; }
  a.opt .ic svg { width: 22px; height: 22px; transform: rotate(-45deg); }
  a.opt .t { font-size: 1.05rem; letter-spacing: .06em; }
  .tag { border-radius: 0; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); padding: 2px 9px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg></div>
      <span class="kicker">BLAZBLUE ENTROPY EFFECT</span>
      <h1>蒼翼混沌效應 <span>攻略工具</span></h1>
      <p class="sub">策略羅盤（配裝模擬）· 角色技能樹（潛能一覽）</p>
    </div>
    <div class="opts" id="opts">
      <a class="opt" href="strategy-compass.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 110 20 10 10 0 010-20zM16 8l-2.5 5.5L8 16l2.5-5.5z"/></svg></span>
        <span><span class="t">策略羅盤</span><div class="d">配裝規劃、紅策前置與傳承記錄，手機／桌面自適應</div></span>
      </a>
      <a class="opt" href="character-skills.html">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v5M12 8l-6 5M12 8l6 5M6 13v4M18 13v4M12 8v9M4 17h4v4H4zM10 17h4v4h-4zM16 17h4v4h-4zM10 1h4v4h-4z"/></svg></span>
        <span><span class="t">角色技能樹</span><span class="tag">17 角色 · 16 位含潛能資料</span><div class="d">潛能、天賦、傳承技與各招式分支（手機／桌面皆可用）</div></span>
      </a>
    </div>
    <p class="foot">Steam／PC 版配裝工具 · 同一配裝，手機與桌面皆可使用。</p>
  </div>


</body>
</html>
